name: Stage 1a contract verification

on:
  push:
    branches:
      - feat/stage-1a-contract-tooling

permissions:
  contents: write

concurrency:
  group: stage1a-bootstrap
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Resolve lockfile when missing
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Verify contracts and bundle
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
      - name: Publish verified lockfile as immutable Git blob
        if: ${{ hashFiles('package-lock.json') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY' > /tmp/lock-blob.json
          import base64, json, sys
          with open('package-lock.json', 'rb') as fh:
              content = base64.b64encode(fh.read()).decode('ascii')
          json.dump({'content': content, 'encoding': 'base64'}, sys.stdout)
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/lock-blob.json
